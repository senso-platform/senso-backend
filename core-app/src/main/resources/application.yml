
spring:
  application.name: senso-core
  threads.virtual.enabled: true

  datasource:
    # SENSO_DB_URL обязан начинаться с "jdbc:" — иначе Hikari роняет старт.
    # Значения по умолчанию нет: api/worker получают URL извне.
    url: ${SENSO_DB_URL}
    username: ${SENSO_DB_USER}
    password: ${SENSO_DB_PASSWORD}

  flyway:
    enabled: true

    # История миграций — в платформенной схеме.
    locations:
      - classpath:db/migration/platform
      - classpath:db/migration/identity
      - classpath:db/migration/devices
      - classpath:db/migration/telemetry
      - classpath:db/migration/alerts

    schemas: platform,identity,devices,telemetry,alerts
    create-schemas: true

    # Миграции из разных веток могут вливаться не по порядку.
    out-of-order: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  rabbitmq:
    host: ${SENSO_RABBIT_HOST}
    port: ${SENSO_RABBIT_AMQP_PORT:5672}
    username: ${SENSO_RABBIT_USER}
    password: ${SENSO_RABBIT_PASSWORD}
    virtual-host: senso
    listener:
      simple:
        # Ошибка обработки → 3 повтора с паузой 0.5 → 1 → 2 с, затем reject без requeue → DLX senso.dlq / failed →
        # q.dlq.failed (AGENTS.md §6). Requeue не используем: в RabbitMQ 4.x он не учитывается x-delivery-limit,
        # и сообщение крутилось бы бесконечно (docs/dev/TROUBLESHOOTING.md, раздел RabbitMQ).
        default-requeue-rejected: false
        retry:
          enabled: true
          stateless: true
          max-retries: 3
          initial-interval: 500ms
          multiplier: 2
          max-interval: 5s

  modulith:
    events:
      jdbc:
        schema: platform
        schema-initialization:
          enabled: false

      # Завершённые публикации удаляются.
      # Незавершённые остаются для повторной отправки.
      completion-mode: delete

management:
  endpoints:
    web:
      exposure:
        # Modulith доступен только в local.
        include: health,info,prometheus

  endpoint:
    health:
      probes:
        enabled: true

# JWT: RSA-ключи загружаются из переменных окружения.
# Закрытый ключ нельзя хранить в Git.
senso:
  jwt:
    public-key: ${SENSO_JWT_PUBLIC_KEY:}
    private-key: ${SENSO_JWT_PRIVATE_KEY:}
