[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "senso-emulator"
version = "0.1.0"
description = "SensoBazaar IoT gateway emulator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "paho-mqtt>=2.1,<3",
  "uuid6>=2024.7.10,<2027",
]

[project.optional-dependencies]
test = [
  "jsonschema[format]>=4.23,<5",
  "pytest>=8.3,<10",
]
dev = [
  "jsonschema[format]>=4.23,<5",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
senso-emulator = "senso_emulator.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
  "integration: requires an isolated disposable RabbitMQ instance and explicit opt-in",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
