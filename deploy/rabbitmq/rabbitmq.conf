## Пользователи, vhost, обменники и входная очередь ingest
load_definitions = /etc/rabbitmq/definitions.json

## MQTT
mqtt.vhost = senso
mqtt.exchange = amq.topic
mqtt.allow_anonymous = false
mqtt.listeners.tcp.default = 1883
# TLS (8883) настраиваем на dev-стенде вместе с C++ командой, локально не нужен.

## Авторизация
# S1: встроенная база пользователей (definitions.json).
auth_backends.1 = internal
# S2: шлюзы проверяются через core-api с кэшем, сервисные пользователи остаются во внутренней базе.
# auth_backends.1 = internal
# auth_backends.2 = cache
# auth_cache.cached_backend = http
# auth_cache.cache_ttl = 60000
# auth_http.http_method = post
# auth_http.user_path     = http://core-api:8080/internal/mqtt-auth/user
# auth_http.vhost_path    = http://core-api:8080/internal/mqtt-auth/vhost
# auth_http.resource_path = http://core-api:8080/internal/mqtt-auth/resource
# auth_http.topic_path    = http://core-api:8080/internal/mqtt-auth/topic

## Лимиты
# Сообщения от шлюза до 256 КБ (ADR §6.2), запас под заголовки.
max_message_size = 524288
# В 4.x лимиты MQTT задаются размером пакета; authenticated обязан быть <= max_message_size (assert при старте).
mqtt.max_packet_size_authenticated = 524288
mqtt.max_packet_size_unauthenticated = 524288
