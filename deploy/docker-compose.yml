  #   healthcheck: ... /actuator/health/readiness
  # core-worker: тот же образ, SPRING_PROFILES_ACTIVE=worker, depends_on core-api: service_healthy (миграции)
  # ingest:      build ingest-app, depends_on rabbitmq: service_healthy

  # --- profile: emulator -------------------------------------------------------------------
