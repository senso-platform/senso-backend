  #     SENSO_DB_PASSWORD: ${SENSO_DB_PASSWORD}
  #     SENSO_RABBIT_HOST: rabbitmq
  #     SENSO_RABBIT_USER: ${SENSO_RABBIT_CORE_USER}
  #     SENSO_RABBIT_PASSWORD: ${SENSO_RABBIT_CORE_PASSWORD}
  #   ports: ["127.0.0.1:8080:8080"]
